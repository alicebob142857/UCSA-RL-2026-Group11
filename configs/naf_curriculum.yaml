seed: 11
total_steps: 120000
learning_rate: 0.0003
gamma: 0.995
tau: 0.005
batch_size: 256
buffer_size: 200000
learning_starts: 2048
train_freq: 1
gradient_steps: 1
max_grad_norm: 10.0
reward_scale: 0.1
loss: huber

mu_net_arch: []
q_net_arch: [128, 64]
min_p: 0.001
max_p: 100.0

exploration_noise: 0.002
exploration_noise_final: 0.000375
exploration_fraction: 0.70

task: balance
target_wheel_velocity: 0.0
action_limit: 8000.0

start_level: easy
max_level: hard
curriculum: true
promotion_success_rate: 0.75
promotion_patience: 1
promotion_check_freq: 20000
promotion_eval_episodes: 20
best_success_gate: 0.75

lqr_warm_start: true
lqr_exact_linear_init: true
lqr_warm_start_steps: 2000
lqr_warm_start_samples: 12288
lqr_warm_start_batch: 512
lqr_warm_start_lr: 0.001
lqr_trajectory_fraction: 0.15
lqr_rollout_max_steps: 500

prefill_steps: 10000
prefill_policy: lqr
prefill_noise: 0.0005

bc_regularization: true
bc_loss_weight: 0.02
bc_decay_fraction: 0.80

eval_episodes: 20
model_path: outputs/models/group11_naf.pt
eval_csv: outputs/logs/group11_naf_eval.csv
train_log: outputs/logs/group11_naf_train.log
